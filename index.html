<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Pro</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<style>
body{font-family:sans-serif;background:#0f172a;color:#fff;padding:20px}
input,button{padding:10px;margin:5px;width:100%}
.card{background:#fff;color:#000;padding:10px;margin:10px;border-radius:10px}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<h2>Login</h2>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

<h2>Katalog</h2>
<button onclick="logout()">Logout</button>

<div id="admin" style="display:none">
<h3>Tambah Produk</h3>
<input id="nama" placeholder="Nama">
<input id="harga" placeholder="Harga">
<input id="gambar" placeholder="Link Gambar">
<button onclick="tambah()">Tambah</button>
</div>

<h3>Produk</h3>
<div id="list"></div>

<h3>Keranjang</h3>
<div id="cart"></div>
<h4>Total: Rp <span id="total">0</span></h4>

<button onclick="checkout()">Checkout WA</button>

</div>

<script>
  const firebaseConfig = {
  apiKey: "AIzaSyDruQxhQfsmsDAubunSrohBX9ZALlXtp5E",
  authDomain: "toko-pakaian-91050.firebaseapp.com",
  databaseURL: "https://toko-pakaian-91050-default-rtdb.firebaseio.com",
  projectId: "toko-pakaian-91050",
  storageBucket: "toko-pakaian-91050.firebasestorage.app",
  messagingSenderId: "418943349139",
  appId: "1:418943349139:web:6e0a3ab8c71e784c7b7866"
};



firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let cart = [];
let isAdmin = false;
let WA = "6281234567890";

// LOGIN
function login(){
auth.signInWithEmailAndPassword(email.value, pass.value);
}

// REGISTER
function register(){
auth.createUserWithEmailAndPassword(email.value, pass.value);
}

// LOGOUT
function logout(){
auth.signOut();
}

// DETECT USER
auth.onAuthStateChanged(user=>{
if(user){
login.style.display="none";
app.style.display="block";

if(user.email=="admin@gmail.com"){
isAdmin=true;
admin.style.display="block";
}

loadProduk();
}else{
login.style.display="block";
app.style.display="none";
}
});

// TAMBAH PRODUK
function tambah(){
db.collection("produk").add({
nama:nama.value,
harga:harga.value,
gambar:gambar.value
});
}

// LOAD PRODUK REALTIME
function loadProduk(){
db.collection("produk").onSnapshot(snap=>{
let html="";
snap.forEach(doc=>{
let p = doc.data();
html+=`
<div class="card">
<img src="${p.gambar}" width="100%">
<h4>${p.nama}</h4>
<p>Rp ${p.harga}</p>
<button onclick="addCart('${p.nama}','${p.harga}')">Tambah</button>
</div>
`;
});
list.innerHTML = html;
});
}

// CART
function addCart(nama,harga){
cart.push({nama,harga});
renderCart();
}

function renderCart(){
let html="";
let total=0;

cart.forEach(c=>{
html+=`<p>${c.nama} - Rp ${c.harga}</p>`;
total+=parseInt(c.harga);
});

cart.innerHTML = html;
document.getElementById("total").innerText = total;
}

// CHECKOUT WA
function checkout(){
let pesan="Halo, saya pesan:\n";
cart.forEach(c=>{
pesan+=`${c.nama} - Rp ${c.harga}\n`;
});
window.open(`https://wa.me/${WA}?text=`+encodeURIComponent(pesan));
}
</script>

</body>
</html>
