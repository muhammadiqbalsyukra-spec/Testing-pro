<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Jualan</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}

/* ===== BACKGROUND ===== */
body{
display:flex;justify-content:center;align-items:center;
min-height:100vh;
background:url('https://images.unsplash.com/photo-1501785888041-af3ef285b470') no-repeat center/cover;
}

/* ===== LOGIN ===== */
.login-box{
width:340px;padding:40px;background:rgba(255,255,255,0.08);
border-radius:16px;backdrop-filter:blur(12px);
box-shadow:0 25px 50px rgba(0,0,0,0.3);
color:#fff
}

.login-box h2{text-align:center;margin-bottom:30px}

.input-group{margin-bottom:20px}
.input-group input{
width:100%;padding:12px;border:none;
border-bottom:1px solid #fff;background:transparent;color:#fff
}

.login-btn{
width:100%;padding:12px;background:#0ea5e9;
border:none;border-radius:6px;color:#fff;cursor:pointer
}

/* ===== APP ===== */
.app{
display:none;
width:100%;
padding:20px;
}

.header{
display:flex;justify-content:space-between;align-items:center;
color:#fff;margin-bottom:20px
}

.btn{
padding:8px 12px;background:#0ea5e9;border:none;color:#fff;border-radius:6px;cursor:pointer
}

.products{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:15px;
}

.card{
background:#fff;border-radius:10px;padding:10px;text-align:center
}

.card img{
width:100%;height:120px;object-fit:cover;border-radius:8px
}

.card h4{font-size:14px;margin:5px 0}
.card p{color:green;font-weight:600}

.wa{
margin-top:5px;
background:#25D366;
border:none;color:#fff;padding:6px;border-radius:6px;cursor:pointer
}

.delete{
background:red;margin-top:5px
}

/* ===== FORM ===== */
.form{
margin-bottom:20px;
background:#fff;padding:10px;border-radius:10px
}

.form input{
width:100%;margin-bottom:5px;padding:8px
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-box" id="loginBox">
<h2>LOGIN</h2>
<form id="loginForm">
<div class="input-group">
<input type="text" id="username" placeholder="Username" required>
</div>
<div class="input-group">
<input type="password" id="password" placeholder="Password" required>
</div>
<button class="login-btn">Sign In</button>
</form>
</div>

<!-- APP -->
<div class="app" id="app">

<div class="header">
<h3>Katalog Jualan</h3>
<button class="btn" onclick="logout()">Logout</button>
</div>

<!-- FORM ADMIN -->
<div id="adminForm" class="form" style="display:none">
<input type="text" id="nama" placeholder="Nama Produk">
<input type="number" id="harga" placeholder="Harga">
<input type="text" id="gambar" placeholder="Link Gambar">
<button class="btn" onclick="tambahProduk()">Tambah</button>
</div>

<div class="products" id="produkList"></div>

</div>

<script>
let isAdmin = false;
let WA = "6281234567890"; // GANTI NOMOR KAMU

// LOGIN
document.getElementById("loginForm").onsubmit = function(e){
e.preventDefault();

let user = username.value;
let pass = password.value;

if(user=="admin" && pass=="123"){
isAdmin = true;
document.getElementById("adminForm").style.display="block";
}

loginBox.style.display="none";
app.style.display="block";
loadProduk();
}

// LOGOUT
function logout(){
location.reload();
}

// DATA PRODUK
function getProduk(){
return JSON.parse(localStorage.getItem("produk")||"[]");
}

function saveProduk(data){
localStorage.setItem("produk",JSON.stringify(data));
}

// LOAD PRODUK
function loadProduk(){
let data = getProduk();
let html = "";

data.forEach((p,i)=>{
html+=`
<div class="card">
<img src="${p.gambar}">
<h4>${p.nama}</h4>
<p>Rp ${p.harga}</p>
<button class="wa" onclick="order('${p.nama}','${p.harga}')">Order WA</button>
${isAdmin? `<button class="delete" onclick="hapus(${i})">Hapus</button>`:""}
</div>
`;
});

produkList.innerHTML = html;
}

// TAMBAH
function tambahProduk(){
let data = getProduk();

data.push({
nama:nama.value,
harga:harga.value,
gambar:gambar.value
});

saveProduk(data);
loadProduk();

nama.value="";
harga.value="";
gambar.value="";
}

// HAPUS
function hapus(i){
let data = getProduk();
data.splice(i,1);
saveProduk(data);
loadProduk();
}

// ORDER WA
function order(nama,harga){
let pesan = `Halo, saya mau pesan:\n${nama}\nHarga: Rp ${harga}`;
window.open(`https://wa.me/${WA}?text=`+encodeURIComponent(pesan));
}
</script>

</body>
</html>
