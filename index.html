<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EduSmart E-Rapor SD Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#0f172a;
color:white;
display:flex;
min-height:100vh;
}

/* SIDEBAR */

.sidebar{
width:260px;
background:#020617;
padding:20px;
position:fixed;
left:0;
top:0;
height:100vh;
overflow:auto;
}

.logo{
font-size:28px;
font-weight:800;
margin-bottom:30px;
}

.menu button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
margin-bottom:12px;
background:#111827;
color:white;
cursor:pointer;
font-size:15px;
font-weight:600;
transition:.2s;
}

.menu button:hover{
background:#0ea5e9;
}

/* MAIN */

.main{
flex:1;
margin-left:260px;
padding:25px;
}

.card{
background:#111827;
padding:20px;
border-radius:22px;
margin-bottom:20px;
}

.card-title{
font-size:24px;
font-weight:700;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:12px;
}

input,select,textarea{
padding:12px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
width:100%;
}

textarea{
min-height:100px;
resize:none;
}

.save-btn{
margin-top:15px;
padding:14px;
border:none;
border-radius:12px;
background:#0ea5e9;
color:white;
font-weight:700;
cursor:pointer;
width:100%;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:12px;
border-bottom:1px solid rgba(255,255,255,.1);
text-align:left;
}

.action-btn{
padding:8px 14px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:13px;
font-weight:700;
}

.print-btn{
background:#22c55e;
color:white;
}

.delete-btn{
background:#ef4444;
color:white;
}

.stat-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}

.stat-box{
background:#1e293b;
padding:20px;
border-radius:18px;
}

.stat-box h1{
font-size:32px;
margin-bottom:8px;
}

/* RAPOR */

.rapor-page{
background:white;
color:black;
padding:40px;
border-radius:20px;
margin-top:20px;
page-break-after:always;
}

.rapor-header{
text-align:center;
margin-bottom:30px;
}

.rapor-header h1{
font-size:28px;
margin-bottom:8px;
}

.identitas{
margin-top:20px;
line-height:2;
}

.nilai-table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

.nilai-table th,
.nilai-table td{
border:1px solid #ccc;
padding:10px;
font-size:14px;
}

.ttd-area{
margin-top:80px;
display:flex;
justify-content:space-between;
}

.ttd-box{
width:250px;
text-align:center;
}

.ttd-space{
height:80px;
}

.photo-box{
width:120px;
height:160px;
border:2px solid #999;
display:flex;
align-items:center;
justify-content:center;
font-size:13px;
margin-top:30px;
}

/* PRINT */

@media print{

body{
background:white;
}

.sidebar,
.no-print{
display:none !important;
}

.main{
margin:0;
padding:0;
}

.rapor-page{
box-shadow:none;
border-radius:0;
margin:0;
width:100%;
min-height:100vh;
}

}

@media(max-width:768px){

.sidebar{
position:relative;
width:100%;
height:auto;
}

.main{
margin-left:0;
}

body{
display:block;
}

}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">
🎓 EduSmart
</div>

<div class="menu">

<button onclick="showSection('dashboardSection')">
🏠 Dashboard
</button>

<button onclick="showSection('siswaSection')">
👨‍🎓 Data Siswa
</button>

<button onclick="showSection('nilaiSection')">
📚 Input Nilai
</button>

<button onclick="showSection('raporSection')">
🖨️ E-Rapor
</button>

</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- DASHBOARD -->

<div id="dashboardSection" class="section">

<div class="card">

<div class="card-title">
Dashboard Sekolah
</div>

<div class="stat-grid">

<div class="stat-box">
<h1 id="totalSiswa">0</h1>
<p>Total Siswa</p>
</div>

<div class="stat-box">
<h1 id="rataNilai">0</h1>
<p>Rata-rata Nilai</p>
</div>

</div>

</div>

</div>

<!-- DATA SISWA -->

<div id="siswaSection" class="section" style="display:none;">

<div class="card">

<div class="card-title">
📋 Data Lengkap Siswa
</div>

<div class="grid">

<input type="text" id="nama" placeholder="Nama Siswa">

<input type="text" id="nis" placeholder="NIS">

<input type="text" id="nisn" placeholder="NISN">

<input type="text" id="kelas" placeholder="Kelas">

<input type="text" id="ttl" placeholder="Tempat/Tanggal Lahir">

<select id="jk">

<option>Laki-laki</option>
<option>Perempuan</option>

</select>

<input type="text" id="agama" placeholder="Agama">

<input type="text" id="alamat" placeholder="Alamat">

<input type="text" id="ayah" placeholder="Nama Ayah">

<input type="text" id="ibu" placeholder="Nama Ibu">

</div>

<button class="save-btn" onclick="simpanSiswa()">
💾 Simpan Data
</button>

<table>

<thead>

<tr>

<th>Nama</th>
<th>Kelas</th>
<th>Aksi</th>

</tr>

</thead>

<tbody id="tableSiswa"></tbody>

</table>

</div>

</div>

<!-- INPUT NILAI -->

<div id="nilaiSection" class="section" style="display:none;">

<div class="card">

<div class="card-title">
📚 Input Nilai
</div>

<select id="pilihSiswa"></select>

<div class="grid" style="margin-top:15px;">

<input type="number" id="indo" placeholder="Bahasa Indonesia">

<input type="number" id="mtk" placeholder="Matematika">

<input type="number" id="ipa" placeholder="IPA">

<input type="number" id="ips" placeholder="IPS">

<input type="number" id="agamaNilai" placeholder="Agama">

<input type="number" id="pjok" placeholder="PJOK">

</div>

<button class="save-btn" onclick="simpanNilai()">
💾 Simpan Nilai
</button>

</div>

</div>

<!-- RAPOR -->

<div id="raporSection" class="section" style="display:none;">

<div class="card no-print">

<div class="card-title">
🖨️ Cetak E-Rapor
</div>

<select id="raporSelect" onchange="renderRapor()"></select>

<button class="save-btn" onclick="downloadPDF()">
⬇️ Download PDF
</button>

</div>

<div id="raporArea"></div>

</div>

</div>

<script>

/* DATA */

let dataSiswa =
JSON.parse(localStorage.getItem('dataSiswa')) || [];

let nilaiSiswa =
JSON.parse(localStorage.getItem('nilaiSiswa')) || [];

/* SECTION */

function showSection(id){

document.querySelectorAll('.section')
.forEach(sec=>{

sec.style.display='none';

});

document.getElementById(id)
.style.display='block';

if(id==='raporSection'){

renderRapor();

}

}

/* SIMPAN SISWA */

function simpanSiswa(){

const siswa={

nama:nama.value,
nis:nis.value,
nisn:nisn.value,
kelas:kelas.value,
ttl:ttl.value,
jk:jk.value,
agama:agama.value,
alamat:alamat.value,
ayah:ayah.value,
ibu:ibu.value

};

dataSiswa.push(siswa);

localStorage.setItem(
'dataSiswa',
JSON.stringify(dataSiswa)
);

renderSiswa();

alert('Data siswa tersimpan');

}

/* RENDER SISWA */

function renderSiswa(){

tableSiswa.innerHTML='';
pilihSiswa.innerHTML='';
raporSelect.innerHTML='';

dataSiswa.forEach((s,index)=>{

tableSiswa.innerHTML += `

<tr>

<td>${s.nama}</td>
<td>${s.kelas}</td>

<td>

<button
class="action-btn print-btn"
onclick="langsungRapor(${index})">

Print

</button>

<button
class="action-btn delete-btn"
onclick="hapusSiswa(${index})">

Hapus

</button>

</td>

</tr>

`;

pilihSiswa.innerHTML += `
<option value="${index}">
${s.nama}
</option>
`;

raporSelect.innerHTML += `
<option value="${index}">
${s.nama}
</option>
`;

});

updateDashboard();

}

/* HAPUS */

function hapusSiswa(i){

if(confirm('Hapus siswa?')){

dataSiswa.splice(i,1);
nilaiSiswa.splice(i,1);

localStorage.setItem(
'dataSiswa',
JSON.stringify(dataSiswa)
);

localStorage.setItem(
'nilaiSiswa',
JSON.stringify(nilaiSiswa)
);

renderSiswa();

}

}

/* SIMPAN NILAI */

function simpanNilai(){

const i=pilihSiswa.value;

nilaiSiswa[i]={

indo:Number(indo.value||0),
mtk:Number(mtk.value||0),
ipa:Number(ipa.value||0),
ips:Number(ips.value||0),
agama:Number(agamaNilai.value||0),
pjok:Number(pjok.value||0)

};

localStorage.setItem(
'nilaiSiswa',
JSON.stringify(nilaiSiswa)
);

alert('Nilai tersimpan');

updateDashboard();

}

/* DASHBOARD */

function updateDashboard(){

totalSiswa.innerText=
dataSiswa.length;

let total=0;
let count=0;

nilaiSiswa.forEach(n=>{

if(!n) return;

total += (
n.indo+
n.mtk+
n.ipa+
n.ips+
n.agama+
n.pjok
)/6;

count++;

});

rataNilai.innerText=
Math.round(total/count || 0);

}

/* RAPOR */

function renderRapor(){

const i=raporSelect.value || 0;

const s=dataSiswa[i];

if(!s) return;

const n=nilaiSiswa[i] || {};

const rata = Math.round(

(
(n.indo||0)+
(n.mtk||0)+
(n.ipa||0)+
(n.ips||0)+
(n.agama||0)+
(n.pjok||0)

)/6

);

raporArea.innerHTML=`

<div class="rapor-page">

<div class="rapor-header">

<h1>RAPOR PESERTA DIDIK</h1>

<p>
SEKOLAH DASAR
</p>

</div>

<div class="identitas">

<p>
<b>Nama:</b> ${s.nama}
</p>

<p>
<b>NIS:</b> ${s.nis}
</p>

<p>
<b>NISN:</b> ${s.nisn}
</p>

<p>
<b>Kelas:</b> ${s.kelas}
</p>

<p>
<b>TTL:</b> ${s.ttl}
</p>

<p>
<b>Jenis Kelamin:</b> ${s.jk}
</p>

<p>
<b>Agama:</b> ${s.agama}
</p>

<p>
<b>Alamat:</b> ${s.alamat}
</p>

<p>
<b>Nama Ayah:</b> ${s.ayah}
</p>

<p>
<b>Nama Ibu:</b> ${s.ibu}
</p>

</div>

<table class="nilai-table">

<thead>

<tr>

<th>No</th>
<th>Mata Pelajaran</th>
<th>Nilai</th>
<th>Predikat</th>
<th>Deskripsi</th>

</tr>

</thead>

<tbody>

${buatBaris(
1,
'Bahasa Indonesia',
n.indo
)}

${buatBaris(
2,
'Matematika',
n.mtk
)}

${buatBaris(
3,
'IPA',
n.ipa
)}

${buatBaris(
4,
'IPS',
n.ips
)}

${buatBaris(
5,
'Agama',
n.agama
)}

${buatBaris(
6,
'PJOK',
n.pjok
)}

</tbody>

</table>

<div style="margin-top:25px;">

<b>Rata-rata:</b>
${rata}

</div>

<div class="ttd-area">

<div>

<div class="photo-box">

Tempel Foto

</div>

</div>

<div class="ttd-box">

<p>Kepala Sekolah</p>

<div class="ttd-space"></div>

<b>Suryawati Effa S.Pd</b>

<br>

NIP 19580818 198411 2001

</div>

</div>

</div>

`;

}

/* BARIS NILAI */

function buatBaris(
no,
mapel,
nilai
){

nilai = nilai || 0;

let predikat='D';
let desk='Perlu bimbingan';

if(nilai>=90){

predikat='A';
desk='Sangat baik';

}

else if(nilai>=80){

predikat='B';
desk='Baik';

}

else if(nilai>=70){

predikat='C';
desk='Cukup';

}

return `

<tr>

<td>${no}</td>

<td>${mapel}</td>

<td>${nilai}</td>

<td>${predikat}</td>

<td>${desk}</td>

</tr>

`;

}

/* PRINT LANGSUNG */

function langsungRapor(i){

showSection('raporSection');

raporSelect.value=i;

renderRapor();

}

/* PDF */

function downloadPDF(){

const el=
document.getElementById('raporArea');

html2pdf().from(el).save();

}

/* START */

renderSiswa();

</script>

</body>
</html>
