<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}

body{
min-height:100vh;
background:url('https://images.unsplash.com/photo-1501785888041-af3ef285b470') no-repeat center/cover;
color:#fff;
}

/* LOGIN */
#login{
width:320px;margin:100px auto;padding:40px;
background:rgba(255,255,255,0.15);
border-radius:16px;
backdrop-filter:blur(12px);
}

input,button{
width:100%;padding:12px;margin-bottom:10px;
border:none;border-radius:6px;
}

input{color:#000}

button{
background:#0ea5e9;color:#fff;
cursor:pointer;
}

#app{display:none;padding:15px}

.header{
display:flex;justify-content:space-between;
align-items:center;margin-bottom:15px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:15px;
}

.card{
background:#fff;color:#000;
border-radius:12px;
overflow:hidden;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.card img{
width:100%;height:140px;object-fit:cover;
}

.card-body{padding:10px}

.price{color:green;font-weight:600}

.card button{
margin-top:5px;font-size:12px;padding:6px;
}

#admin{
display:none;
background:rgba(0,0,0,0.5);
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

#preview{
width:100%;height:120px;
object-fit:cover;
border-radius:8px;
margin-bottom:10px;
}

.wa{background:#25D366}
.delete{background:red}
.edit{background:orange}
</style>
</head>

<body>

<div id="login">
<h2>Login</h2>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>

<div id="app">

<div class="header">
<h3>Katalog</h3>
<button onclick="logout()">Logout</button>
</div>

<div id="admin">
<h4>Admin Panel</h4>

<input id="namaInput" placeholder="Nama Produk">
<input id="hargaInput" type="number" placeholder="Harga">

<input type="file" id="file" onchange="previewImage()">
<img id="preview">

<button onclick="tambah()">Upload Produk</button>
</div>

<div class="products" id="list"></div>

<h3>Total: Rp <span id="total">0</span></h3>
<button class="wa" onclick="checkout()">Checkout WhatsApp</button>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDruQxhQfsmsDAubunSrohBX9ZALlXtp5E",
  authDomain: "toko-pakaian-91050.firebaseapp.com",
  projectId: "toko-pakaian-91050",
  storageBucket: "toko-pakaian-91050.appspot.com",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

let ADMIN_EMAIL = "muhammadiqbalsyukra@gmail.com";
let cart = [];
let WA = "6282285712293";

// LOGIN
function login(){
const email = document.getElementById("email").value.trim();
const pass = document.getElementById("pass").value.trim();

if(!email || !pass){
alert("Email & Password wajib diisi!");
return;
}

auth.signInWithEmailAndPassword(email, pass)
.catch(e=>alert(e.message));
}

// REGISTER
function register(){
const email = document.getElementById("email").value.trim();
const pass = document.getElementById("pass").value.trim();

if(!email || !pass){
alert("Email & Password wajib diisi!");
return;
}

auth.createUserWithEmailAndPassword(email, pass)
.catch(e=>alert(e.message));
}

// LOGOUT
function logout(){
auth.signOut();
}

// AUTH
auth.onAuthStateChanged(user=>{
if(user){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
document.getElementById("admin").style.display =
(user.email===ADMIN_EMAIL) ? "block" : "none";
loadProduk();
}else{
document.getElementById("login").style.display="block";
document.getElementById("app").style.display="none";
}
});

// PREVIEW
function previewImage(){
const file = document.getElementById("file").files[0];
if(file){
document.getElementById("preview").src = URL.createObjectURL(file);
}
}

// 🔥 TAMBAH PRODUK FIX
async function tambah(){
try{
const nama = document.getElementById("namaInput").value.trim();
const harga = document.getElementById("hargaInput").value.trim();
const file = document.getElementById("file").files[0];

if(!nama || !harga || !file){
alert("Lengkapi semua data!");
return;
}

const fileName = Date.now() + "_" + file.name.replace(/\s/g,"");
const storageRef = storage.ref().child("produk/" + fileName);

const snapshot = await storageRef.put(file);
const url = await snapshot.ref.getDownloadURL();

await db.collection("produk").add({
nama,
harga: parseInt(harga),
gambar: url,
createdAt: new Date()
});

alert("✅ Produk berhasil diupload!");

// reset
document.getElementById("namaInput").value="";
document.getElementById("hargaInput").value="";
document.getElementById("file").value="";
document.getElementById("preview").src="";

}catch(err){
console.error(err);
alert("❌ Upload gagal: " + err.message);
}
}

// LOAD PRODUK
function loadProduk(){
db.collection("produk").onSnapshot(snap=>{
let html="";
snap.forEach(doc=>{
let p = doc.data();

html+=`
<div class="card">
<img src="${p.gambar}">
<div class="card-body">
<h4>${p.nama}</h4>
<p class="price">Rp ${p.harga}</p>

<button onclick="addCart('${p.nama}',${p.harga})">Tambah</button>

${auth.currentUser?.email===ADMIN_EMAIL ? `
<button class="edit" onclick="editProduk('${doc.id}','${p.nama}',${p.harga})">Edit</button>
<button class="delete" onclick="hapus('${doc.id}')">Hapus</button>
`: ""}

</div>
</div>`;
});

document.getElementById("list").innerHTML = html;
});
}

// EDIT
function editProduk(id,nama,harga){
const n = prompt("Nama:",nama);
const h = prompt("Harga:",harga);
if(n && h){
db.collection("produk").doc(id).update({
nama:n,
harga:parseInt(h)
});
}
}

// HAPUS
function hapus(id){
if(confirm("Hapus produk?")){
db.collection("produk").doc(id).delete();
}
}

// CART
function addCart(nama,harga){
cart.push({nama,harga});
renderCart();
}

function renderCart(){
let total=0;
cart.forEach(c=> total+=c.harga);
document.getElementById("total").innerText = total;
}

// CHECKOUT
function checkout(){
if(cart.length===0){
alert("Keranjang kosong!");
return;
}

let pesan="Halo, saya pesan:\n";
cart.forEach(c=>{
pesan+=`${c.nama} - Rp ${c.harga}\n`;
});

window.open(`https://wa.me/${WA}?text=`+encodeURIComponent(pesan));
}
</script>

</body>
</html>
