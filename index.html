<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}

body{
min-height:100vh;
background:url('https://images.unsplash.com/photo-1501785888041-af3ef285b470') no-repeat center/cover;
display:flex;justify-content:center;align-items:center;color:#fff;
}

/* LOGIN */
#login{
width:320px;padding:40px;background:rgba(255,255,255,0.08);
border-radius:16px;backdrop-filter:blur(12px);
box-shadow:0 25px 50px rgba(0,0,0,0.3);
}

input{
width:100%;padding:12px;margin-bottom:15px;
border:none;border-bottom:1px solid #fff;
background:transparent;color:#fff;
}

button{
width:100%;padding:12px;margin-top:5px;
background:#0ea5e9;border:none;color:#fff;border-radius:6px;
}

/* APP */
#app{display:none;width:100%;padding:15px}

.header{display:flex;justify-content:space-between;margin-bottom:15px}

.products{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:10px;
}

.card{
background:#fff;color:#000;padding:10px;border-radius:10px
}

.card img{
width:100%;height:120px;object-fit:cover;border-radius:8px
}

.wa{background:#25D366}
</style>
</head>

<body>

<div id="login">
<h2>Login</h2>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>

<div id="app">
<div class="header">
<h3>Katalog</h3>
<button onclick="logout()">Logout</button>
</div>

<div id="admin" style="display:none">
<input id="nama" placeholder="Nama Produk">
<input id="harga" placeholder="Harga">
<input id="gambar" placeholder="Link Gambar">
<button onclick="tambah()">Tambah Produk</button>
</div>

<div class="products" id="list"></div>

<div id="cart"></div>
<h3>Total: Rp <span id="total">0</span></h3>

<button class="wa" onclick="checkout()">Checkout WhatsApp</button>
</div>

<script>
// CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDruQxhQfsmsDAubunSrohBX9ZALlXtp5E",
  authDomain: "toko-pakaian-91050.firebaseapp.com",
  projectId: "toko-pakaian-91050",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let cart = [];
let WA = "6281234567890";

// LOGIN
function login(){
const email = document.getElementById("email").value.trim();
const pass = document.getElementById("pass").value.trim();

console.log("klik login");

auth.signInWithEmailAndPassword(email, pass)
.then(()=>{
  console.log("LOGIN BERHASIL");
})
.catch(e=>{
  console.error(e);
  alert(e.message);
});
}

// REGISTER
function register(){
const email = document.getElementById("email").value.trim();
const pass = document.getElementById("pass").value.trim();

auth.createUserWithEmailAndPassword(email, pass)
.then(()=>{
  alert("Register berhasil, silakan login");
})
.catch(e=>{
  alert(e.message);
});
}

// LOGOUT
function logout(){
auth.signOut();
}

// DETECT USER
auth.onAuthStateChanged(user=>{
console.log("USER:", user);

const loginBox = document.getElementById("login");
const appBox = document.getElementById("app");

if(user){
  loginBox.style.display="none";
  appBox.style.display="block";
  loadProduk();
}else{
  loginBox.style.display="block";
  appBox.style.display="none";
}
});

// TAMBAH PRODUK
function tambah(){
const nama = document.getElementById("nama").value;
const harga = document.getElementById("harga").value;
const gambar = document.getElementById("gambar").value;

db.collection("produk").add({nama,harga,gambar});
}

// LOAD PRODUK
function loadProduk(){
db.collection("produk").onSnapshot(snap=>{
let html="";
snap.forEach(doc=>{
let p = doc.data();
html+=`
<div class="card">
<img src="${p.gambar}">
<h4>${p.nama}</h4>
<p>Rp ${p.harga}</p>
<button onclick="addCart('${p.nama}','${p.harga}')">Tambah</button>
</div>`;
});
document.getElementById("list").innerHTML = html;
});
}

// CART
function addCart(nama,harga){
cart.push({nama,harga});
renderCart();
}

function renderCart(){
let html="";
let total=0;

cart.forEach(c=>{
html+=`<p>${c.nama} - Rp ${c.harga}</p>`;
total+=parseInt(c.harga);
});

document.getElementById("cart").innerHTML = html;
document.getElementById("total").innerText = total;
}

// CHECKOUT
function checkout(){
let pesan="Halo, saya pesan:\n";
cart.forEach(c=>{
pesan+=`${c.nama} - Rp ${c.harga}\n`;
});
window.open(`https://wa.me/${WA}?text=`+encodeURIComponent(pesan));
}
</script>

</body>
</html>
