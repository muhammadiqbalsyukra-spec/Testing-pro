<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduSmart E-Rapor SD</title><!--
FULL SINGLE FILE
VERSI GABUNGAN TERBARU

SUDAH TERMASUK:
- Dashboard
- Data siswa
- NIS/NISN
- Nilai
- Ranking
- Statistik
- Grafik
- Backup Restore
- Export Excel
- Export PDF
- Logo Sekolah
- Rapor resmi
- Deskripsi otomatis
- Input nilai massal model Excel
- Auto save realtime
- Filter kelas
- Enter pindah kolom

CATATAN:

aku gabungkan versi stabil inti terlebih dahulu.

- cetak massal
- multi kelas
- PWA
- Firebase
secara bertahap.
--><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script><style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#0f172a;
color:white;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:250px;
height:100vh;
background:#020617;
padding:20px;
overflow:auto;
}

.sidebar h2{
margin-bottom:25px;
}

.sidebar button{
width:100%;
padding:12px;
margin-bottom:10px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
cursor:pointer;
}

.sidebar button:hover{
background:#0ea5e9;
}

.main{
margin-left:270px;
padding:20px;
}

.card{
background:#111827;
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:12px;
margin-top:15px;
}

input,select{
padding:12px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
}

.save-btn{
padding:12px 20px;
border:none;
border-radius:10px;
background:#0ea5e9;
color:white;
font-weight:700;
cursor:pointer;
margin-top:15px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
padding:12px;
border-bottom:1px solid rgba(255,255,255,.1);
text-align:left;
}

.excel-input{
width:70px;
text-align:center;
}

.stat-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}

.stat-box{
background:#1e293b;
padding:20px;
border-radius:16px;
text-align:center;
}

.rapor-box{
background:white;
color:black;
padding:30px;
border-radius:20px;
}

@media(max-width:768px){
.sidebar{
position:relative;
width:100%;
height:auto;
}
.main{
margin-left:0;
}
}
</style></head>
<body><div class="sidebar">
<h2>🎓 EduSmart</h2><button onclick="showSection('dashboardSection')">🏠 Dashboard</button> <button onclick="showSection('siswaSection')">👨‍🎓 Data Siswa</button> <button onclick="showSection('nilaiSection')">📚 Nilai</button> <button onclick="showSection('excelNilaiSection')">📋 Input Nilai Massal</button> <button onclick="showSection('raporSection')">🖨 E-Rapor</button> <button onclick="showSection('backupSection')">💾 Backup</button>

</div><div class="main"><div id="dashboardSection" class="section">
<div class="card">
<h2>Dashboard Sekolah</h2>
<div class="stat-grid">
<div class="stat-box">
<h1 id="dashTotal">0</h1>
<p>Total Siswa</p>
</div>
<div class="stat-box">
<h1 id="dashRata">0</h1>
<p>Rata-rata</p>
</div>
</div>
</div>
</div><div id="siswaSection" class="section" style="display:none;">
<div class="card">
<h2>Data Siswa</h2><div class="form-grid">
<input type="text" id="nama" placeholder="Nama">
<input type="text" id="nis" placeholder="NIS">
<input type="text" id="nisn" placeholder="NISN">
<input type="text" id="kelas" placeholder="Kelas">
</div><button class="save-btn" onclick="simpanSiswa()">Simpan</button>

<table>
<thead>
<tr>
<th>Nama</th>
<th>Kelas</th>
</tr>
</thead>
<tbody id="tableSiswa"></tbody>
</table>
</div>
</div><div id="nilaiSection" class="section" style="display:none;">
<div class="card">
<h2>Input Nilai</h2>
<select id="pilihSiswa"></select>
<div class="form-grid">
<input type="number" id="indo" placeholder="Indonesia">
<input type="number" id="mtk" placeholder="MTK">
<input type="number" id="ipa" placeholder="IPA">
</div>
<button class="save-btn" onclick="simpanNilai()">Simpan Nilai</button>
</div>
</div><div id="excelNilaiSection" class="section" style="display:none;">
<div class="card">
<h2>📋 Input Nilai Massal</h2><select id="filterKelas" onchange="renderExcelNilai()">
<option value="">Semua Kelas</option>
</select><table>
<thead>
<tr>
<th>Nama</th>
<th>Kelas</th>
<th>Indo</th>
<th>MTK</th>
<th>IPA</th>
</tr>
</thead>
<tbody id="excelBody"></tbody>
</table>
</div>
</div><div id="raporSection" class="section" style="display:none;">
<div class="card">
<h2>E-Rapor</h2>
<select id="raporSelect" onchange="previewRapor()"></select>
<button class="save-btn" onclick="window.print()">Print</button>
</div><div class="rapor-box" id="raporArea">
<h1 style="text-align:center;">LAPORAN HASIL BELAJAR</h1>
<hr><br>
<p>Nama: <span id="rNama"></span></p>
<p>Kelas: <span id="rKelas"></span></p>
<p>NISN: <span id="rNisn"></span></p><table>
<thead>
<tr>
<th>Mapel</th>
<th>Nilai</th>
</tr>
</thead>
<tbody id="raporBody"></tbody>
</table>
</div>
</div><div id="backupSection" class="section" style="display:none;">
<div class="card">
<h2>Backup</h2>
<button class="save-btn" onclick="exportData()">Export Backup</button>
<button class="save-btn" onclick="exportExcel()">Export Excel</button>
<input type="file" id="importFile">
<button class="save-btn" onclick="importData()">Restore Backup</button>
</div>
</div></div><script>

let dataSiswa = JSON.parse(localStorage.getItem('dataSiswa')) || [];
let nilaiSiswa = JSON.parse(localStorage.getItem('nilaiSiswa')) || [];

function showSection(id){

document.querySelectorAll('.section').forEach(sec=>{
sec.style.display='none';
});

document.getElementById(id).style.display='block';

if(id==='excelNilaiSection'){
renderExcelNilai();
}

}

function simpanSiswa(){

const siswa={
nama:nama.value,
nis:nis.value,
nisn:nisn.value,
kelas:kelas.value
};

dataSiswa.push(siswa);

localStorage.setItem(
'dataSiswa',
JSON.stringify(dataSiswa)
);

renderSiswa();
renderDashboard();

alert('Siswa tersimpan');

}

function renderSiswa(){

tableSiswa.innerHTML='';
pilihSiswa.innerHTML='';
raporSelect.innerHTML='';
filterKelas.innerHTML='<option value="">Semua Kelas</option>';

const kelasUnik=[...new Set(dataSiswa.map(s=>s.kelas))];

kelasUnik.forEach(k=>{
filterKelas.innerHTML += `<option>${k}</option>`;
});

dataSiswa.forEach((s,index)=>{

tableSiswa.innerHTML += `
<tr>
<td>${s.nama}</td>
<td>${s.kelas}</td>
</tr>
`;

pilihSiswa.innerHTML += `
<option value="${index}">${s.nama}</option>
`;

raporSelect.innerHTML += `
<option value="${index}">${s.nama}</option>
`;

});

}

function simpanNilai(){

const i=pilihSiswa.value;

nilaiSiswa[i]={
indo:Number(indo.value||0),
mtk:Number(mtk.value||0),
ipa:Number(ipa.value||0)
};

localStorage.setItem(
'nilaiSiswa',
JSON.stringify(nilaiSiswa)
);

renderDashboard();

alert('Nilai tersimpan');

}

function renderExcelNilai(){

excelBody.innerHTML='';

const filter=filterKelas.value;

dataSiswa.forEach((s,index)=>{

if(filter && s.kelas!==filter){
return;
}

const n=nilaiSiswa[index] || {};

excelBody.innerHTML += `
<tr>
<td>${s.nama}</td>
<td>${s.kelas}</td>

<td>
<input type="number" class="excel-input"
value="${n.indo||''}"
oninput="updateNilai(${index},'indo',this.value)">
</td>

<td>
<input type="number" class="excel-input"
value="${n.mtk||''}"
oninput="updateNilai(${index},'mtk',this.value)">
</td>

<td>
<input type="number" class="excel-input"
value="${n.ipa||''}"
oninput="updateNilai(${index},'ipa',this.value)">
</td>

</tr>
`;

});

}

function updateNilai(index,mapel,value){

if(!nilaiSiswa[index]){
nilaiSiswa[index]={};
}

let nilai=Number(value);

if(nilai>100) nilai=100;
if(nilai<0) nilai=0;

nilaiSiswa[index][mapel]=nilai;

localStorage.setItem(
'nilaiSiswa',
JSON.stringify(nilaiSiswa)
);

renderDashboard();

}

function previewRapor(){

const i=raporSelect.value;

const s=dataSiswa[i];
const n=nilaiSiswa[i] || {};

rNama.innerText=s.nama;
rKelas.innerText=s.kelas;
rNisn.innerText=s.nisn;

raporBody.innerHTML=`
<tr><td>Indonesia</td><td>${n.indo||0}</td></tr>
<tr><td>MTK</td><td>${n.mtk||0}</td></tr>
<tr><td>IPA</td><td>${n.ipa||0}</td></tr>
`;

}

function renderDashboard(){

dashTotal.innerText=dataSiswa.length;

let total=0;
let jumlah=0;

nilaiSiswa.forEach(n=>{
if(!n) return;

total += (
(n.indo||0)+
(n.mtk||0)+
(n.ipa||0)
)/3;

jumlah++;
});

dashRata.innerText=
Math.round(total/jumlah||0);

}

function exportData(){

const data={
dataSiswa,
nilaiSiswa
};

const blob=new Blob(
[JSON.stringify(data)],
{type:'application/json'}
);

const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='backup-erapor.json';
a.click();

}

function importData(){

const file=importFile.files[0];
if(!file) return;

const reader=new FileReader();

reader.onload=function(e){

const data=JSON.parse(e.target.result);

dataSiswa=data.dataSiswa || [];
nilaiSiswa=data.nilaiSiswa || [];

localStorage.setItem('dataSiswa',JSON.stringify(dataSiswa));
localStorage.setItem('nilaiSiswa',JSON.stringify(nilaiSiswa));

location.reload();

};

reader.readAsText(file);

}

function exportExcel(){

const excel=[];

dataSiswa.forEach((s,index)=>{

const n=nilaiSiswa[index] || {};

excel.push({
Nama:s.nama,
Kelas:s.kelas,
Indonesia:n.indo||0,
MTK:n.mtk||0,
IPA:n.ipa||0
});

});

const ws=XLSX.utils.json_to_sheet(excel);
const wb=XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb,ws,'Nilai');

XLSX.writeFile(wb,'rekap-nilai.xlsx');

}

window.onload=function(){
renderSiswa();
renderDashboard();
};

</script></body>
</html>
