<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}

body{
min-height:100vh;
background:url('https://images.unsplash.com/photo-1501785888041-af3ef285b470') no-repeat center/cover;
display:flex;justify-content:center;align-items:center;color:#fff;
}

/* LOGIN */
#login{
width:320px;padding:40px;background:rgba(255,255,255,0.08);
border-radius:16px;backdrop-filter:blur(12px);
box-shadow:0 25px 50px rgba(0,0,0,0.3);
}

input{
width:100%;padding:12px;margin-bottom:15px;
border:none;border-bottom:1px solid #fff;
background:transparent;color:#fff;
}

button{
width:100%;padding:12px;margin-top:5px;
background:#0ea5e9;border:none;color:#fff;border-radius:6px;
cursor:pointer;
}

/* APP */
#app{display:none;width:100%;padding:15px}

.header{display:flex;justify-content:space-between;margin-bottom:15px}

.products{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:10px;
}

.card{
background:#fff;color:#000;padding:10px;border-radius:10px
}

.card img{
width:100%;height:120px;object-fit:cover;border-radius:8px
}

.wa{background:#25D366}

/* ADMIN */
#admin{
display:none;
background:rgba(255,255,255,0.1);
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

#formProduk{
display:none;
margin-top:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<h2>Login</h2>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>

<!-- APP -->
<div id="app">

<div class="header">
<h3>Katalog</h3>
<button onclick="logout()">Logout</button>
</div>

<!-- ADMIN -->
<div id="admin">

<h4>Menu Admin</h4>
<button onclick="toggleForm()">➕ Tambah Produk</button>

<div id="formProduk">
<input id="nama" placeholder="Nama Produk">
<input id="harga" placeholder="Harga">
<input id="gambar" placeholder="Link Gambar">

<button onclick="tambah()">Simpan</button>
<button onclick="toggleForm()" style="background:#555">Batal</button>
</div>

</div>

<div class="products" id="list"></div>

<div id="cart"></div>
<h3>Total: Rp <span id="total">0</span></h3>

<button class="wa" onclick="checkout()">Checkout WhatsApp</button>

</div>

<script>
// CONFIG FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyDruQxhQfsmsDAubunSrohBX9ZALlXtp5E",
  authDomain: "toko-pakaian-91050.firebaseapp.com",
  projectId: "toko-pakaian-91050",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let cart = [];
let WA = "6282285712293"; // ganti nomor kamu
let ADMIN_EMAIL = "muhammadiqbalsyukra@gmail.com"; // ganti email kamu

// LOGIN
function login(){
const email = document.getElementById("email").value.trim();
const pass = document.getElementById("pass").value.trim();

auth.signInWithEmailAndPassword(email, pass)
.catch(e=>alert(e.message));
}

// REGISTER
function register(){
const email = document.getElementById("email").value.trim();
const pass = document.getElementById("pass").value.trim();

auth.createUserWithEmailAndPassword(email, pass)
.then(()=>alert("Register berhasil, silakan login"))
.catch(e=>alert(e.message));
}

// LOGOUT
function logout(){
auth.signOut();
}

// DETECT USER
auth.onAuthStateChanged(user=>{
const loginBox = document.getElementById("login");
const appBox = document.getElementById("app");
const adminBox = document.getElementById("admin");

if(user){
  loginBox.style.display="none";
  appBox.style.display="block";

  if(user.email === ADMIN_EMAIL){
    adminBox.style.display="block";
  }else{
    adminBox.style.display="none";
  }

  loadProduk();
}else{
  loginBox.style.display="block";
  appBox.style.display="none";
}
});

// TOGGLE FORM
function toggleForm(){
const form = document.getElementById("formProduk");
form.style.display = form.style.display === "block" ? "none" : "block";
}

// TAMBAH PRODUK
function tambah(){
const nama = document.getElementById("nama").value.trim();
const harga = document.getElementById("harga").value.trim();
const gambar = document.getElementById("gambar").value.trim();

if(!nama || !harga || !gambar){
  alert("Isi semua data!");
  return;
}

db.collection("produk").add({
  nama,
  harga,
  gambar,
  createdAt: Date.now()
})
.then(()=>{
  alert("Produk berhasil ditambahkan!");

  document.getElementById("nama").value="";
  document.getElementById("harga").value="";
  document.getElementById("gambar").value="";

  toggleForm();
});
}

// LOAD PRODUK
function loadProduk(){
db.collection("produk").orderBy("createdAt","desc").onSnapshot(snap=>{
let html="";
snap.forEach(doc=>{
let p = doc.data();
html+=`
<div class="card">
<img src="${p.gambar}">
<h4>${p.nama}</h4>
<p>Rp ${p.harga}</p>
<button onclick="addCart('${p.nama}','${p.harga}')">Tambah</button>
</div>`;
});
document.getElementById("list").innerHTML = html;
});
}

// CART
function addCart(nama,harga){
cart.push({nama,harga});
renderCart();
}

function renderCart(){
let html="";
let total=0;

cart.forEach(c=>{
html+=`<p>${c.nama} - Rp ${c.harga}</p>`;
total+=parseInt(c.harga);
});

document.getElementById("cart").innerHTML = html;
document.getElementById("total").innerText = total;
}

// CHECKOUT
function checkout(){
let pesan="Halo, saya pesan:\n";
cart.forEach(c=>{
pesan+=`${c.nama} - Rp ${c.harga}\n`;
});
window.open(`https://wa.me/${082285712293}?text=`+encodeURIComponent(pesan));
}
</script>

</body>
</html>
